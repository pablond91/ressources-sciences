<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Flashcards - Types de Pesticides</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .mission-box {
      background-color: #e8f4f8;
      border-left: 4px solid #2a9d8f;
      padding: 10px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      max-width: 360px;
      font-size: 0.9em;
      color: #1d3557;
      text-align: center;
    }

    .status-bar {
      margin-bottom: 10px;
      font-weight: bold;
      color: #333;
    }

    .card-container {
      width: 340px;
      height: 220px;
      perspective: 1000px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      border-radius: 12px;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card-front {
      background-color: #ffffff;
      color: #2c3e50;
      border: 2px solid #e0e0e0;
    }

    .card-back {
      background-color: #2e4057;
      color: #ffffff;
      transform: rotateY(180deg);
    }

    .tag {
      font-size: 0.8em;
      background: #e76f51;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 15px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-doubt {
      background-color: #e76f51;
      color: white;
    }

    .btn-doubt:hover { background-color: #d65a3d; }

    .btn-success {
      background-color: #2a9d8f;
      color: white;
    }

    .btn-success:hover { background-color: #218276; }

    .btn-restart {
      background-color: #4a90e2;
      color: white;
      display: none;
    }

    .instruction {
      font-size: 0.85em;
      color: #777;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h2>🌱 Quiz Révision : Les Pesticides & Cibles</h2>

  <!-- Consigne claire ajoutée -->
  <div class="mission-box">
    🎯 <b>Consigne :</b> Avant de retourner la carte, retrouve dans ta tête :
    <br>1. Le <b>type</b> de pesticide <i>(herbicide, fongicide ou insecticide)</i>
    <br>2. La <b>cible</b> exacte
    <br>3. Un <b>effet non-cible</b> potentiel
  </div>

  <div class="status-bar" id="status">Chargement...</div>

  <div class="card-container" onclick="flipCard()">
    <div class="card" id="flashcard">
      <div class="card-front" id="card-front"></div>
      <div class="card-back" id="card-back"></div>
    </div>
  </div>
  <div class="instruction">💡 Clique sur la carte pour vérifier tes réponses</div>

  <div class="controls">
    <button class="btn-doubt" onclick="answer(false)">J'avais un doute ❓</button>
    <button class="btn-success" onclick="answer(true)">Réussi ✅</button>
    <button class="btn-restart" id="btn-restart" onclick="restart()">Recommencer 🔄</button>
  </div>

  <script>
    const initialCards = [
      {
        tag: "Pomme de terre",
        front: "Attaque de Mildiou (champignon parasitaire) sur le feuillage.",
        type: "FONGICIDE",
        cible: "Champignons parasites",
        nonCible: "Champignons utiles du sol (microfaune)"
      },
      {
        tag: "Champ de Blé",
        front: "Invasion de coquelicots et d'adventices étouffant le blé.",
        type: "HERBICIDE",
        cible: "Mauvaises herbes (plantes)",
        nonCible: "Pollution des nappes phréatiques & flore sauvage"
      },
      {
        tag: "Culture de Colza",
        front: "Colonisation de pucerons suceurs de sève sur les jeunes pousses.",
        type: "INSECTICIDE",
        cible: "Insectes ravageurs",
        nonCible: "Abeilles (pollinisateurs) et oiseaux insectivores"
      },
      {
        tag: "Verger de Pommiers",
        front: "Développement d'une tavelure (taches noires causées par un champignon sur les fruits).",
        type: "FONGICIDE",
        cible: "Champignons parasites",
        nonCible: "Organismes décomposeurs du sol"
      },
      {
        tag: "Champ de Maïs",
        front: "Attaque de la pyrale (chenille dévorant la tige du maïs).",
        type: "INSECTICIDE",
        cible: "Larves et chenilles d'insectes",
        nonCible: "Coccinelles et prédateurs naturels"
      },
      {
        tag: "Jardin potager",
        front: "Prolifération de pissenlits empêchant la pousse des carottes.",
        type: "HERBICIDE",
        cible: "Plantes indésirables",
        nonCible: "Vers de terre et nutriments de la lithosphère"
      }
    ];

    let currentQueue = [];
    let isFlipped = false;

    function initDeck() {
      currentQueue = [...initialCards];
      isFlipped = false;
      document.getElementById('flashcard').classList.remove('flipped');
      document.getElementById('btn-restart').style.display = "none";
      document.querySelector('.btn-doubt').style.display = "inline-block";
      document.querySelector('.btn-success').style.display = "inline-block";
      showCard();
    }

    function showCard() {
      if (currentQueue.length === 0) {
        document.getElementById('status').innerText = "🎉 Bravo ! Toutes les cartes sont validées !";
        document.getElementById('card-front').innerHTML = "<h3>Session terminée !</h3>";
        document.getElementById('card-back').innerHTML = "<h3>100% de réussite</h3>";
        document.querySelector('.btn-doubt').style.display = "none";
        document.querySelector('.btn-success').style.display = "none";
        document.getElementById('btn-restart').style.display = "inline-block";
        return;
      }

      document.getElementById('status').innerText = `Cartes restantes : ${currentQueue.length}`;
      const cardData = currentQueue[0];

      document.getElementById('card-front').innerHTML = `
        <span class="tag">${cardData.tag}</span>
        <p><b>Symptôme :</b> ${cardData.front}</p>
      `;

      document.getElementById('card-back').innerHTML = `
        <h3>${cardData.type}</h3>
        <p><b>Cible :</b> ${cardData.cible}</p>
        <p style="font-size:0.85em; margin-top:5px;"><b>Effet non-cible :</b> ${cardData.nonCible}</p>
      `;
    }

    function flipCard() {
      const card = document.getElementById('flashcard');
      isFlipped = !isFlipped;
      card.classList.toggle('flipped', isFlipped);
    }

    function answer(isSuccess) {
      if (isFlipped) {
        flipCard();
        setTimeout(processAnswer, 300);
      } else {
        processAnswer();
      }

      function processAnswer() {
        const processedCard = currentQueue.shift();
        if (!isSuccess) {
          currentQueue.push(processedCard);
        }
        showCard();
      }
    }

    function restart() {
      initDeck();
    }

    initDeck();
  </script>
</body>
</html>
